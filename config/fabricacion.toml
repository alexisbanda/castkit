# Parámetros de fabricación de castkit.
#
# Cada sección corresponde a una etapa del pipeline. Las opciones de la
# línea de comandos de esa etapa (por ejemplo, --caras-max de
# `castkit limpieza`) sobrescriben, una a una, los valores de aquí.

[limpieza]
# Número máximo de caras de la malla limpia (se simplifica si la malla en
# bruto, ya escalada y cerrada, tiene más).
caras_max = 200000

# Distancia máxima, en milímetros, permitida entre la malla original
# (escalada y recortada) y la malla limpia.
tolerancia_mm = 0.2

# Milímetros que se recortan desde la base de la malla antes de dejarla
# plana en z = 0.
corte_base_mm = 0.5

# Perímetro máximo, en milímetros, de una zona abierta de la malla (medido
# tras escalarla) para que se cierre automáticamente. Las zonas más grandes
# impiden cerrar la malla.
agujero_max_mm = 10

# Tamaño de vóxel, en milímetros, usado cuando se recurre al remallado de
# respaldo en Blender para cerrar mallas muy abiertas.
voxel_mm = 0.3

[generacion]
# Proveedor enchufable por defecto para generar la malla 3D a partir de los
# insumos del brief ("comando", "imagen-3d" o "tripo3d").
proveedor = "comando"

# Comando externo para el proveedor "comando". Se ejecuta pasando la ruta de
# salida en la variable de entorno CASTKIT_SALIDA_STL (y como último argumento)
# junto con las rutas de los insumos en CASTKIT_INSUMOS y el prompt en
# CASTKIT_PROMPT.
comando = ""

# Versión del modelo de Tripo3D (API v3) usada por el proveedor "tripo3d".
tripo_modelo = "v2.5-20250123"

# Plazo máximo, en segundos, que el proveedor "tripo3d" espera a que la
# tarea termine antes de fallar.
tripo_espera_max_s = 600

[relieve]
# Proveedor local "relieve" (#43): bajorrelieve por capas de color para
# diseños planos (logos, escudos, medallas, apliques). Es un molde abierto
# (#55): necesita --tipo-molde abierto, --largo-mm y --grosor-mm.

# Número máximo de colores planos al reducir la imagen (Image.quantize).
colores_max = 8

# Altura, en milímetros, propuesta para el color de mayor área de la figura
# (la base del relieve). Valor relativo: se reescala a grosor_mm.
base_mm = 2.0

# Milímetros que sube la altura propuesta de un color al siguiente, de más
# a menos área (los detalles pequeños quedan más altos). Valor relativo.
paso_mm = 0.4

# Milímetros que se contrae cada nivel respecto al de abajo, para que no
# queden paredes coincidentes entre niveles.
escalon_mm = 0.05

# Área mínima, en mm², de una mancha de color para que no se descarte
# (limpia el antialias y el ruido de la imagen).
area_min_mm2 = 0.5

# Grosor, en milímetros, de la placa de apoyo. 0 = sin placa: las piezas
# sueltas (islas) se aceptan como piezas separadas y su altura se limita al
# nivel más bajo del diseño.
placa_mm = 0

# Margen, en milímetros, de la placa alrededor de la silueta conjunta del
# diseño (solo si placa_mm > 0).
placa_margen_mm = 1.0

[mecha]
# Diámetro, en milímetros, del canal de mecha vertical para figuras de cera.
diametro_mecha_mm = 3.0

# Espesor mínimo de pared lateral, en milímetros, que debe quedar alrededor del
# canal de mecha antes de pedir confirmación al operador.
espesor_minimo_pared_mm = 1.2

[matriz]
# Espesor, en milímetros, de la placa base inferior sobre la que apoya la
# figura (tanto en modo "figura" como en modo "cubeta").
espesor_base_mm = 3.0

# Margen libre de silicona, en milímetros, entre las figuras y la cara interior
# de la pared perimetral (modo "cubeta").
margen_silicona_mm = 10.0

# Grosor, en milímetros, de la pared perimetral exterior (modo "cubeta").
espesor_pared_mm = 3.0

# Altura libre de silicona, en milímetros, por encima del punto más alto de la
# figura hasta el borde superior de la pared (modo "cubeta").
margen_superior_mm = 10.0

# Separación mínima, en milímetros, entre figuras vecinas cuando la versión
# tiene más de una cavidad (modo "cubeta").
separacion_cavidades_mm = 10.0
