[project]
name = "castkit"
version = "0.1.1"
description = "Castkit — Agent-assisted pipeline that turns 3D models into production-ready mold masters and multi-cavity mold boxes for artisan casting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "trimesh>=4.5.3",
    "manifold3d>=3.1.1",
    "fast-simplification>=0.2.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "pillow>=13.0.0",
    "scikit-image>=0.25",
]

[project.optional-dependencies]
# Proveedor local "profundidad" (#56): mapa de profundidad con Depth Anything
# V2 Small (Apache-2.0), en CPU. Opcional para no cargar PyTorch a quien no
# lo use: sin este extra, el proveedor falla con un mensaje que explica cómo
# instalarlo (ver castkit.generacion.ProveedorProfundidad).
profundidad = [
    "torch>=2.2",
    "transformers>=4.40",
]

[project.scripts]
castkit = "castkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# PyTorch no publica ruedas para CPU en PyPI en todas las plataformas; se usa
# el índice oficial de PyTorch solo para `torch`, y solo fuera de macOS
# (donde las ruedas de PyPI ya son para CPU/Metal).
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/castkit"]

[tool.hatch.build.targets.wheel.force-include]
# La configuración de fabricación y la versión de Blender fijada no viven
# dentro de `src/castkit` (para no duplicarlas: el repo ya las tiene en
# `config/` y en la raíz, ver #64), pero el wheel instalado las necesita
# para poder crear la copia del usuario con `importlib.resources`
# (`castkit.config.ruta_config_fabricacion`/`version_blender_fijada`).
"config/fabricacion.toml" = "castkit/datos/fabricacion.toml"
".blender-version" = "castkit/datos/blender-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "blender: necesita el ejecutable de Blender",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
